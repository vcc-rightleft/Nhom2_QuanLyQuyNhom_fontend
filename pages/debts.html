<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Công nợ của tôi - Quản Lý Quỹ Nhóm</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* Bổ sung style riêng cho trang Công nợ của tôi (T3CD249) */
        .debt-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border-left: 5px solid #cbd5e1;
        }

        .summary-card.owe {
            border-left-color: #ef4444;
        }

        .summary-card.owed {
            border-left-color: #10b981;
        }

        .summary-card.net {
            border-left-color: #3b82f6;
        }

        .summary-card .label {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .summary-card .amount {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
        }

        .summary-card.owe .amount {
            color: #dc2626;
        }

        .summary-card.owed .amount {
            color: #059669;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            align-items: center;
        }

        .filter-bar select,
        .filter-bar input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .group-debt-section {
            background: #fff;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .group-header {
            background: #f8fafc;
            padding: 14px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-title {
            font-weight: 700;
            font-size: 16px;
            color: #0f172a;
        }

        .debt-item {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            gap: 12px;
        }

        .debt-item:last-child {
            border-bottom: none;
        }

        .debt-info h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #1e293b;
        }

        .debt-meta {
            font-size: 13px;
            color: #64748b;
        }

        .debt-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .debt-amount {
            font-weight: 700;
            font-size: 16px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-unpaid {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-pending {
            background: #fef3c7;
            color: #b45309;
        }

        .badge-paid {
            background: #d1fae5;
            color: #047857;
        }

        .badge-receive {
            background: #e0f2fe;
            color: #0369a1;
        }

        .btn-pay {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-pay:hover {
            background: #1d4ed8;
        }

        .btn-pay:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* Modal Xác nhận thanh toán */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #64748b;
        }

        .bank-card {
            background: #f8fafc;
            border: 1px dashed #94a3b8;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .bank-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .bank-row:last-child {
            margin-bottom: 0;
        }

        .copy-btn {
            background: #e2e8f0;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .copy-btn:hover {
            background: #cbd5e1;
        }

        .qr-wrapper {
            text-align: center;
            margin: 12px 0;
        }

        .qr-wrapper img {
            width: 170px;
            height: 170px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .upload-area {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            margin-top: 8px;
            transition: border-color 0.2s;
        }

        .upload-area:hover {
            border-color: #2563eb;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
            object-fit: contain;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }
    </style>
</head>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>
