<!DOCTYPE html>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Micro-interactions -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>

                extend: {
                    colors: {
                        canvas: '#F6F5F0',
                        surface: '#FFFFFF',
                        ink: '#121212',
                        muted: '#52525B',
                        line: '#E4E4E7',
                        indigo: {
                            DEFAULT: '#7C3AED',
                            50: '#F5F3FF',
                            100: '#EDE9FE',
                            600: '#7C3AED',
                            700: '#6D28D9'
                        },
                        lime: {
                            DEFAULT: '#D4FF00',
                            soft: '#F4FFC2'
                        },
                        coral: '#FF5E36',
                        cyan: '#38BDF8',
                        amber: '#FACC15',
                        mint: '#10B981'
                    },
                    fontFamily: {
                        display: ['"Space Grotesk"', 'sans-serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'clean': '3px 3px 0px #121212',
                        'bold': '4px 4px 0px #121212',
                        'bold-sm': '2px 2px 0px #121212',
                    }
                }
            }
        }
    </script>

        <link rel="stylesheet" href="./css/squad-foundation.css">
    <link rel="stylesheet" href="./css/squad-components.css">
